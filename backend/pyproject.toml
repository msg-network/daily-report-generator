[tool.poetry]
package-mode = false

[project]
name = "daily-report-backend"
version = "0.1.0"
description = "Daily report generator backend"
authors = [
    {name = "msg-network"}
]
requires-python = "^3.13"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "mangum (>=0.21.0,<0.22.0)",
    "boto3 (>=1.42.87,<2.0.0)",
    "botocore[crt] (>=1.42.87,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.10,<0.16.0)"
]
